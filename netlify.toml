[build]
  # El repositorio tiene la aplicación dentro de Where_to_Go_Proyecto_Completo.
  # Cuando Netlify se conecta desde la raíz, "public" no existe en ese nivel.
  publish = "Where_to_Go_Proyecto_Completo/public"
  functions = "Where_to_Go_Proyecto_Completo/netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
