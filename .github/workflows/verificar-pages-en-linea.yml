name: Where to Go - Probar enlace móvil publicado
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Where to Go - Vista móvil alternativa sin Netlify']
    types: [completed]
jobs:
  comprobar_web:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Comprobar galerías de lugares auténticos, Las Terrenas y diseño en Internet
        run: |
          python - <<'PY'
          import json,time,urllib.error,urllib.request
          base='https://wheretogoapp.github.io/where-to-go-app/'
          def fetch(path):
              url=base+path+'?v='+str(int(time.time()))
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'WhereToGo-DeploymentTest/1.0'}),timeout=30) as r:
                          data=r.read();print(r.status,path,len(data),'bytes',flush=True)
                          assert r.status==200,(r.status,path)
                          return data
                  except Exception as e:
                      print('Intento',attempt+1,path,type(e).__name__,str(e)[:150],flush=True)
                      if attempt==4:raise
                      time.sleep(5)
          html=fetch('').decode('utf-8')
          assert 'mobile-focus.css' in html
          assert 'pilot.js' not in html
          assert 'photo-atlas.js' in html
          assert 'photo-atlas.css' in html
          assert 'Las Terrenas' in html
          js=fetch('app.js').decode('utf-8')
          assert 'Las Terrenas' in js
          assert 'placeGalleryMarkup' in js
          fetch('mobile-focus.css')
          fetch('photo-atlas.js')
          fetch('photo-atlas.css')
          manifest=json.loads(fetch('data/places/manifest.json'))
          assert manifest['recordCount']>=44000
          assert manifest['categories']['restaurantes']>=3700
          assert manifest['categories']['discotecas']>=200
          # Check what the public visitor actually needs: a nonempty place
          # catalogue and a real licensed photo gallery, not stale counters.
          gallery=json.loads(fetch('data/place-gallery.json'))
          assert sum(len(items) for items in gallery.values())>=450
          atlas=json.loads(fetch('data/photo-atlas-rd.json'))
          assert atlas.get('count',0)>=500
          puerto=json.loads(fetch('data/places/cell_548_546.json'))
          assert len(puerto)>=100
          assert any(x.get('cat')=='restaurantes' for x in puerto)
          assert any(x.get('cat')=='hoteles' for x in puerto)
          terrenas=json.loads(fetch('data/places/cell_546_552_2_1_0.json'))
          assert any(x['name']=='Terra Bar' for x in terrenas)
          print('SITIO PUBLICO OK:',manifest['recordCount'],'lugares,',
                sum(map(len,gallery.values())),'fotos de galeria,',
                atlas['count'],'fotos ambientales geolocalizadas')
          PY
