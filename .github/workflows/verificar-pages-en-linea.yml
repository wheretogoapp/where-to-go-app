name: Where to Go - Probar enlace móvil publicado
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Where to Go - Vista móvil alternativa sin Netlify']
    types: [completed]
jobs:
  comprobar_web:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Comprobar galerías de lugares auténticos, Las Terrenas y diseño en Internet
        run: |
          python - <<'PY'
          import json,time,urllib.error,urllib.request
          base='https://wheretogoapp.github.io/where-to-go-app/'
          def fetch(path):
              url=base+path+'?v='+str(int(time.time()))
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'WhereToGo-DeploymentTest/1.0'}),timeout=30) as r:
                          data=r.read();print(r.status,path,len(data),'bytes',flush=True)
                          assert r.status==200,(r.status,path)
                          return data
                  except Exception as e:
                      print('Intento',attempt+1,path,type(e).__name__,str(e)[:150],flush=True)
                      if attempt==4:raise
                      time.sleep(5)
          html=fetch('').decode('utf-8')
          assert 'mobile-focus.css' in html
          assert 'pilot.js' not in html
          assert 'photo-atlas.js' not in html
          assert 'Las Terrenas' in html
          js=fetch('app.js').decode('utf-8')
          assert 'Las Terrenas' in js
          assert 'placeGalleryMarkup' in js
          fetch('mobile-focus.css')
          manifest=json.loads(fetch('data/places/manifest.json'))
          assert manifest['recordCount']>=44000
          assert manifest['categories']['restaurantes']>=3700
          assert manifest['categories']['discotecas']>=200
          # Validate the same published build after the CDN receives the new files.
          for attempt in range(12):
              stats=json.loads(fetch('data/place-gallery-stats.json'))
              gallery=json.loads(fetch('data/place-gallery.json'))
              if stats.get('newVerifiedGalleryPhotos',0)>=252 and sum(map(len,gallery.values()))==stats.get('galleryImageCount',0):
                  break
              print('Datos propagándose a Pages; intento',attempt+1,flush=True)
              time.sleep(10)
          assert stats['newVerifiedGalleryPhotos']>=252,stats
          assert stats['galleryImageCount']>=264,stats
          assert sum(map(len,gallery.values()))==stats['galleryImageCount']
          assert len(gallery.get('wd-Q106959726',[]))>=2, 'Falta galería de Casa del Pudín'
          assert len(gallery.get('wd-Q4208698',[]))>=4, 'Falta galería de Cayo Levantado'
          # Specific beaches in Las Terrenas: do not substitute wildlife or
          # unrelated geotagged photographs for actual destination photos.
          assert len(gallery.get('wd-Q125131312',[]))>=5 or any(
              any('Playa_Bonita' in p['source'] for p in items) and len(items)>=5
              for items in gallery.values()), 'No llegaron fotos de Playa Bonita'
          assert any(any('Playa_Cos' in p['source'] for p in items) and len(items)>=5
              for items in gallery.values()), 'No llegaron fotos de Playa Cosón'
          terrenas=json.loads(fetch('data/places/cell_546_552_2_1_0.json'))
          assert any(p['name']=='Terra Bar' for p in terrenas)
          print('SITIO PÚBLICO OK:',manifest['recordCount'],'lugares,',
                stats['newVerifiedGalleryPhotos'],'fotos nuevas verificadas;',
                stats['galleryPlaceCount'],'galerías de lugares')
          PY
