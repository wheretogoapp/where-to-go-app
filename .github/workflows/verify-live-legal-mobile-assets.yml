name: Where to Go - verificar recursos legales y móviles públicos
on:
  push:
    branches:
      - verify/legal-mobile-public-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Comprobar versión exacta y archivos servidos por GitHub Pages
        run: |
          python - <<'PY'
          import json,time,urllib.request
          root='https://wheretogoapp.github.io/where-to-go-app/'
          wanted='6af496f0a0ddaff973baf4807373e1964395509b'
          assets=['data/release.json','index.html','mobile-ui-repair.css?v=1',
                  'traveler-profile.js?v=2','language.js?v=7.2',
                  'legal-language.js?v=1','privacidad.html','terminos.html']
          result={}
          for path in assets:
            last=None
            for attempt in range(5):
              try:
                req=urllib.request.Request(root+path,headers={
                  'Cache-Control':'no-cache','User-Agent':'WTG-Independent-Pages-Audit'})
                with urllib.request.urlopen(req,timeout=20) as r:
                  if r.status!=200:raise RuntimeError(f'HTTP {r.status}')
                  text=r.read().decode('utf-8','replace')
                  if len(text)<80:raise RuntimeError('Empty asset')
                  result[path]=text
                break
              except Exception as e:
                last=e
                time.sleep(3)
            if path not in result:raise SystemExit('FAILED_PUBLIC_ASSET '+path+' '+str(last))
            print('PUBLIC_HTTP_200',path,len(result[path]))
          release=json.loads(result['data/release.json'])
          if release.get('commit')!=wanted:raise SystemExit('Wrong release: '+str(release.get('commit')))
          html=result['index.html']
          assert 'data-view="promocionar"' in html, 'Missing business tab'
          assert 'mobile-ui-repair.css' in html, 'Missing mobile contrast and profile repair'
          assert 'legal-language.js' in result['privacidad.html'], 'Missing privacy localization'
          assert 'legal-language.js' in result['terminos.html'], 'Missing terms localization'
          assert 'const data=' in result['legal-language.js?v=1'], 'Legal translation bundle missing'
          assert '"Perfil":' in result['language.js?v=7.2'], 'Profile tab not translated'
          assert 'profilePreviousMobileView' in result['traveler-profile.js?v=2'], 'Profile nav fix absent'
          assert 'card-open' in result['mobile-ui-repair.css?v=1'], 'Contrast fix absent'
          print('EXACT_PUBLIC_RELEASE_CONFIRMED',wanted)
          print('ALL_EIGHT_REAL_PUBLIC_FILES_CONFIRMED',root)
          PY
