name: Where to Go - Validar datos y GPS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-data-pipeline.yml'
      - 'Where_to_Go_Proyecto_Completo/public/app.js'
      - 'Where_to_Go_Proyecto_Completo/public/index.html'
      - 'Where_to_Go_Proyecto_Completo/public/world-v8.css'
      - 'Where_to_Go_Proyecto_Completo/public/service-worker.js'
      - 'Where_to_Go_Proyecto_Completo/public/pilot.js'
      - 'Where_to_Go_Proyecto_Completo/public/pilot.css'
      - 'Where_to_Go_Proyecto_Completo/public/data/place-gallery.json'
      - 'Where_to_Go_Proyecto_Completo/tools/import_osm_rd.py'
      - 'Where_to_Go_Proyecto_Completo/tools/import_overture_rd.py'
      - 'Where_to_Go_Proyecto_Completo/tools/test_las_terrenas.py'
      - 'Where_to_Go_Proyecto_Completo/tools/build_commons_photo_atlas.py'
      - 'Where_to_Go_Proyecto_Completo/public/photo-atlas.js'
      - 'Where_to_Go_Proyecto_Completo/public/photo-atlas.css'
      - 'Where_to_Go_Proyecto_Completo/public/data/photo-atlas-rd.json'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Comprobar sintaxis JavaScript de la aplicación
        run: |
          node --check Where_to_Go_Proyecto_Completo/public/app.js
          node --check Where_to_Go_Proyecto_Completo/public/experience.js
          node --check Where_to_Go_Proyecto_Completo/public/pilot.js
          node --check Where_to_Go_Proyecto_Completo/public/photo-atlas.js
          node --check Where_to_Go_Proyecto_Completo/public/service-worker.js
      - name: Comprobar Las Terrenas 12 km, las categorías y las 500 imágenes
        run: python Where_to_Go_Proyecto_Completo/tools/test_las_terrenas.py
      - name: Validar fotos múltiples del mismo destino y sus licencias
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('Where_to_Go_Proyecto_Completo/public/data')
          places=json.loads((root/'pilot-places.json').read_text(encoding='utf-8'))
          known={p['id'] for p in places}
          gallery=json.loads((root/'place-gallery.json').read_text(encoding='utf-8'))
          assert len(gallery)>=5
          for place_id,photos in gallery.items():
            assert place_id in known, place_id
            assert 1<=len(photos)<=9, place_id
            seen=set()
            for photo in photos:
              assert photo['url'].startswith('https://commons.wikimedia.org/wiki/Special:FilePath/')
              assert photo['source'].startswith('https://commons.wikimedia.org/wiki/File:')
              assert photo['license'].startswith('https://creativecommons.org/licenses/')
              assert photo['attribution'].strip()
              assert photo['source'] not in seen, 'Foto duplicada en '+place_id
              seen.add(photo['source'])
          print('Galerías verificables:',len(gallery),'fotografías adicionales:',sum(len(x) for x in gallery.values()))
          PY
      - name: Comprobar sintaxis de scripts de datos
        run: |
          python -m py_compile Where_to_Go_Proyecto_Completo/tools/build_commons_photo_atlas.py Where_to_Go_Proyecto_Completo/tools/test_las_terrenas.py
          python -m py_compile Where_to_Go_Proyecto_Completo/tools/import_osm_rd.py Where_to_Go_Proyecto_Completo/tools/import_overture_rd.py Where_to_Go_Proyecto_Completo/tools/enrich_photos.py Where_to_Go_Proyecto_Completo/tools/enrich_geo_photos.py Where_to_Go_Proyecto_Completo/tools/preserve_photos.py Where_to_Go_Proyecto_Completo/tools/probe_google_global.py
      - name: Verificar geoposición y preservación sin conexión
        run: |
          PYTHONPATH=Where_to_Go_Proyecto_Completo/tools python - <<'PY'
          import tempfile, json, pathlib
          from enrich_geo_photos import norm, meters
          from preserve_photos import save, restore
          assert norm('Fortaleza San Felipe') == 'fortaleza san felipe'
          assert meters(19.8, -70.7, 19.8, -70.7) < 1
          assert 100 < meters(19.8, -70.7, 19.802, -70.7) < 250
          with tempfile.TemporaryDirectory() as folder:
              d=pathlib.Path(folder); snapshot=d/'snapshot.json'
              row={'id':'osm-node-42','name':'Fortaleza','cat':'atracciones','lat':19.8,'lon':-70.7,
                   'image':'https://upload.wikimedia.org/wikipedia/commons/a/a1/verified.jpg',
                   'photoSource':'https://commons.wikimedia.org/wiki/File:verified.jpg',
                   'photoAttribution':'Autor · CC BY-SA · Wikimedia Commons'}
              (d/'cell_1_1.json').write_text(json.dumps([row]))
              (d/'manifest.json').write_text(json.dumps({'recordCount':1}))
              save(d,snapshot)
              row.pop('image');row.pop('photoSource');row.pop('photoAttribution')
              (d/'cell_1_1.json').write_text(json.dumps([row]))
              restore(d,snapshot)
              updated=json.loads((d/'cell_1_1.json').read_text())[0]
              assert updated['photoSource'].startswith('https://commons.wikimedia.org/')
              assert json.loads((d/'manifest.json').read_text())['licensedPhotoCount']==1
          print('PRUEBAS OK: geodistancia, nombres y fotografías preservadas.')
          PY
