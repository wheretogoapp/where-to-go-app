name: Where to Go - Vista móvil alternativa sin Netlify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-demo-movil.yml'
      - 'Where_to_Go_Proyecto_Completo/tools/build_pages_preview.py'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: wtg-pages-mobile-backup
  cancel-in-progress: true
jobs:
  demo_movil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Comprobar si GitHub Pages está realmente habilitado
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS --max-time 20 -o /tmp/wtg-pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo 'GitHub Pages está activo. Publicando versión móvil alternativa.'
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PAGES AÚN NO ACTIVADO (respuesta $code)"
            echo "Una sola vez, desde el celular: https://github.com/$GITHUB_REPOSITORY/settings/pages"
            echo "Source: GitHub Actions; guardar. Ejecutar de nuevo este flujo."
            echo "### Publicación no realizada" >> "$GITHUB_STEP_SUMMARY"
            echo "El sitio alternativo todavía no está habilitado (API HTTP $code). Este flujo **no ha publicado una página**." >> "$GITHUB_STEP_SUMMARY"
            echo "Desde Safari, entra primero al repositorio con la cuenta administradora y luego en Settings → Pages → Source: GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Empaquetar web y atlas de 500 fotos para sitio de prueba
        run: |
          python Where_to_Go_Proyecto_Completo/tools/build_pages_preview.py \
            --source Where_to_Go_Proyecto_Completo/public \
            --output /tmp/where-to-go-pages --prefix /where-to-go-app
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: /tmp/where-to-go-pages
      - name: Publicar vista móvil independiente de Netlify
        id: publish
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
      - name: Comprobar el resultado real de la publicación
        if: always()
        env:
          PAGES_ENABLED: ${{ steps.pages.outputs.enabled }}
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          if [ "$PAGES_ENABLED" != "true" ]; then
            echo "::error::No hay URL pública: falta activar GitHub Pages desde la cuenta administradora."
            exit 1
          fi
          if [ -z "$PAGE_URL" ]; then
            echo "::error::No se confirmó un enlace de GitHub Pages publicado."
            exit 1
          fi
          echo "Publicado en: $PAGE_URL"
          echo "### Aplicación publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"

