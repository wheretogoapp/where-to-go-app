name: Where to Go - Vista móvil alternativa sin Netlify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-demo-movil.yml'
      - 'Where_to_Go_Proyecto_Completo/tools/build_pages_preview.py'
      - 'Where_to_Go_Proyecto_Completo/public/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: wtg-pages-mobile-backup
  cancel-in-progress: false
jobs:
  demo_movil:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Empaquetar aplicación para GitHub Pages
        run: |
          python Where_to_Go_Proyecto_Completo/tools/build_pages_preview.py \
            --source Where_to_Go_Proyecto_Completo/public \
            --output /tmp/where-to-go-pages --prefix /where-to-go-app
          test -s /tmp/where-to-go-pages/index.html
          test -s /tmp/where-to-go-pages/navy-gold-mobile.css
          test -s /tmp/where-to-go-pages/tours.js
          test -s /tmp/where-to-go-pages/tours.css
          test -s /tmp/where-to-go-pages/assets/wtg-brand.svg
          grep -q 'data-view="tours"' /tmp/where-to-go-pages/index.html
          grep -q 'data-social="google"' /tmp/where-to-go-pages/index.html
          grep -q 'data-social="apple"' /tmp/where-to-go-pages/index.html
          grep -q 'data-social="facebook"' /tmp/where-to-go-pages/index.html
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio web
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/where-to-go-pages
      - name: Liberar despliegue anterior bloqueado de GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          # SHA devuelto literalmente por GitHub en "Please cancel ... first".
          old_sha='34aa74e7ce81dbc0b5d9435d5f226752921294f6'
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/pages/deployments/'+old_sha
          headers={
            'Accept':'application/vnd.github+json',
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'WhereToGo-Pages-Recovery'
          }
          def api(method, endpoint):
            req=urllib.request.Request(endpoint,headers=headers,method=method)
            with urllib.request.urlopen(req,timeout=25) as response:
              return response.status,response.read()
          try:
            code,body=api('GET',url)
            status=json.loads(body.decode()).get('status','unknown')
            print('Despliegue antiguo '+old_sha[:9]+': '+status)
            if status in ('succeed','deployment_cancelled','failed','cancelled','errored'):
              print('Estado terminal; no es necesario cancelar ese despliegue.')
            else:
              code,_=api('POST',url+'/cancel')
              print('Cancelación solicitada al API oficial de Pages. Respuesta HTTP '+str(code))
          except urllib.error.HTTPError as error:
            details=error.read().decode('utf-8','replace')[:1200]
            if error.code==404:
              print('El despliegue anterior ya no existe (404).')
            else:
              print('No se pudo liberar la publicación: HTTP '+str(error.code)+' '+details)
              raise
          PY
      - name: Publicar aplicación
        id: publish
        uses: actions/deploy-pages@v4
        with:
          timeout: '600000'
      - name: "Verificar que se publicó y responde por HTTP"
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          if [ -z "$PAGE_URL" ]; then
            echo "::error::GitHub no devolvió URL de publicación."
            exit 1
          fi
          python - <<'PY'
          import os,time,urllib.request
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base,headers={'User-Agent':'WhereToGo-DeploymentCheck/1.0'}),timeout=20) as response:
                      body=response.read()
                      if response.status==200 and all(x in body for x in (b'navy-gold-mobile.css',b'data-view="tours"',b'tours.js')):
                          print('Aplicación publicada y verificada:',base)
                          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                              out.write('### Aplicación publicada y comprobada\n'+base+'\n')
                          break
                      raise RuntimeError('Respuesta inesperada: '+str(response.status))
              except Exception as exc:
                  print('Esperando propagación:',attempt+1,str(exc))
                  if attempt==11:raise
                  time.sleep(10)
          PY
