name: Where to Go - Vista móvil alternativa sin Netlify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-demo-movil.yml'
      - 'Where_to_Go_Proyecto_Completo/tools/build_pages_preview.py'
      - 'Where_to_Go_Proyecto_Completo/tests/google-places-browser.test.cjs'
      - 'Where_to_Go_Proyecto_Completo/tests/premium-experience.test.cjs'
      - 'Where_to_Go_Proyecto_Completo/tests/rd-national-coverage.test.cjs'
      - 'Where_to_Go_Proyecto_Completo/public/**'
permissions:
  contents: read
  actions: read
  pages: write
  deployments: write
  id-token: write
concurrency:
  group: wtg-pages-mobile-backup
  cancel-in-progress: false
jobs:
  demo_movil:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Empaquetar aplicación para GitHub Pages
        run: |
          python Where_to_Go_Proyecto_Completo/tools/build_pages_preview.py \
            --source Where_to_Go_Proyecto_Completo/public \
            --output /tmp/where-to-go-pages --prefix /where-to-go-app
          test -s /tmp/where-to-go-pages/index.html
          test -s /tmp/where-to-go-pages/navy-gold-mobile.css
          test -s /tmp/where-to-go-pages/tours.js
          test -s /tmp/where-to-go-pages/tours.css
          test -s /tmp/where-to-go-pages/world-location.js
          test -s /tmp/where-to-go-pages/world-explorer.js
          test -s /tmp/where-to-go-pages/world-explorer.css
          test -s /tmp/where-to-go-pages/city-covers.js
          test -s /tmp/where-to-go-pages/world-geography.js
          test -s /tmp/where-to-go-pages/native-mobile.css
          test -s /tmp/where-to-go-pages/local-discovery.css
          test -s /tmp/where-to-go-pages/area-discovery.css
          test -s /tmp/where-to-go-pages/area-discovery.js
          test -s /tmp/where-to-go-pages/municipality-geocoder.js
          grep -q 'id="wtg-area-discovery"' /tmp/where-to-go-pages/index.html
          test -s /tmp/where-to-go-pages/onboarding.js
          test -s /tmp/where-to-go-pages/onboarding.css
          test -s /tmp/where-to-go-pages/ux-polish.css
          grep -q 'id="wtg-onboarding"' /tmp/where-to-go-pages/index.html
          grep -q 'id="auth-email-reveal"' /tmp/where-to-go-pages/index.html
          grep -q 'WTG_ONBOARDING_ENABLED=true' /tmp/where-to-go-pages/index.html
          python - <<'PY'
          import json, os, pathlib, datetime
          output = pathlib.Path('/tmp/where-to-go-pages/data/release.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'name': 'Where to Go - A dónde ir',
              'features': ['onboarding', 'destination-covers', 'in-app-map', 'complete-local-listings'],
              'built_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          grep -q 'id="wtg-local-discovery"' /tmp/where-to-go-pages/index.html
          grep -q 'A dónde ir' /tmp/where-to-go-pages/index.html
          grep -q 'renderLocalDiscovery' /tmp/where-to-go-pages/app.js
          grep -q 'id="wtg-world-region"' /tmp/where-to-go-pages/index.html
          grep -q 'id="wtg-world-city"' /tmp/where-to-go-pages/index.html
          grep -q 'id="location-pill"' /tmp/where-to-go-pages/index.html
          grep -q 'id="wtg-world-dialog"' /tmp/where-to-go-pages/index.html
          ! grep -q 'id="wtg-world-open"' /tmp/where-to-go-pages/index.html
          test -s /tmp/where-to-go-pages/assets/wtg-brand.svg
          grep -q 'data-view="tours"' /tmp/where-to-go-pages/index.html
          grep -q 'data-social="google"' /tmp/where-to-go-pages/index.html
          grep -q 'data-social="apple"' /tmp/where-to-go-pages/index.html
          grep -q 'data-social="facebook"' /tmp/where-to-go-pages/index.html
      - name: Comprobar que 32 zonas tienen directorio real y JavaScript válido
        run: |
          node --check /tmp/where-to-go-pages/app.js
          node --check /tmp/where-to-go-pages/onboarding.js
          node --check /tmp/where-to-go-pages/google-places-adapter.js
          node --test Where_to_Go_Proyecto_Completo/tests/google-places-browser.test.cjs
          node --test Where_to_Go_Proyecto_Completo/tests/premium-experience.test.cjs
          node --test Where_to_Go_Proyecto_Completo/tests/rd-national-coverage.test.cjs
          node --check /tmp/where-to-go-pages/area-discovery.js
          node --check /tmp/where-to-go-pages/municipality-geocoder.js
          node --check /tmp/where-to-go-pages/world-location.js
          node --check /tmp/where-to-go-pages/world-explorer.js
          grep -q 'wtg-world-selected' /tmp/where-to-go-pages/app.js
          grep -q 'WTG_ACTIVE_COUNTRY' /tmp/where-to-go-pages/app.js
          grep -q 'wtg_world_selection' /tmp/where-to-go-pages/world-explorer.js
          node --check /tmp/where-to-go-pages/city-covers.js
          node --check /tmp/where-to-go-pages/world-geography.js
          node --test Where_to_Go_Proyecto_Completo/tests/world-location.test.cjs
          python Where_to_Go_Proyecto_Completo/tools/test_pages_region_catalog.py /tmp/where-to-go-pages
          test -s /tmp/where-to-go-pages/data/pages-catalog-check.json
      - name: Conectar clave pública restringida de Google Places en la web publicada
        env:
          GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          dest = pathlib.Path('/tmp/where-to-go-pages/google-places-key.js')
          assert dest.is_file(), 'Falta el archivo Google Places para el navegador'
          key = os.getenv('GOOGLE_MAPS_BROWSER_KEY', '').strip()
          if not key:
              print('Google Places: no se configuró GOOGLE_MAPS_BROWSER_KEY; permanece desactivado.')
          else:
              if not re.fullmatch(r'AIza[A-Za-z0-9_-]{20,100}', key):
                  raise SystemExit('GOOGLE_MAPS_BROWSER_KEY no tiene el formato esperado.')
              dest.write_text(
                  '/* Clave pública restringida por dominio y API; generada durante la publicación. */\n'
                  'window.WTG_GOOGLE_MAPS_KEY=' + json.dumps(key) + ';\n',
                  encoding='utf-8'
              )
              print('Google Places: clave de navegador incorporada al despliegue (valor oculto).')
          PY
          node --check /tmp/where-to-go-pages/google-places-key.js
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio web
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/where-to-go-pages
      - name: Esperar que GitHub registre el paquete de Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url=('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
               +'/actions/runs/'+os.environ['GITHUB_RUN_ID']
               +'/artifacts?name=github-pages&per_page=50')
          headers={'Accept':'application/vnd.github+json',
                   'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'User-Agent':'WhereToGo-Pages-ArtifactReady'}
          for attempt in range(15):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as response:
                  artifacts=json.load(response).get('artifacts',[])
              matches=[a for a in artifacts if a.get('name')=='github-pages' and not a.get('expired')]
              if len(matches)==1:
                  print('Paquete GitHub Pages visible en API:',matches[0]['id'])
                  time.sleep(4) # permitir propagación antes de deploy-pages
                  break
              if len(matches)>1:
                  raise SystemExit('Paquetes github-pages duplicados; usar una ejecución nueva, no un reintento del mismo run.')
              print('Esperando paquete publicado en API:',attempt+1)
              if attempt==14:raise SystemExit('GitHub no registró el paquete a tiempo')
              time.sleep(4)
          PY
      - name: Liberar despliegue anterior bloqueado de GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          # SHA devuelto literalmente por GitHub en "Please cancel ... first".
          old_sha='34aa74e7ce81dbc0b5d9435d5f226752921294f6'
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/pages/deployments/'+old_sha
          headers={
            'Accept':'application/vnd.github+json',
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'WhereToGo-Pages-Recovery'
          }
          def api(method, endpoint):
            req=urllib.request.Request(endpoint,headers=headers,method=method)
            with urllib.request.urlopen(req,timeout=25) as response:
              return response.status,response.read()
          try:
            code,body=api('GET',url)
            status=json.loads(body.decode()).get('status','unknown')
            print('Despliegue antiguo '+old_sha[:9]+': '+status)
            if status in ('succeed','deployment_cancelled','failed','cancelled','errored'):
              print('Estado terminal; no es necesario cancelar ese despliegue.')
            else:
              code,_=api('POST',url+'/cancel')
              print('Cancelación solicitada al API oficial de Pages. Respuesta HTTP '+str(code))
          except urllib.error.HTTPError as error:
            details=error.read().decode('utf-8','replace')[:1200]
            if error.code==404:
              print('El despliegue anterior ya no existe (404).')
            else:
              print('No se pudo liberar la publicación: HTTP '+str(error.code)+' '+details)
              raise
          PY
      - name: Desbloquear estados de despliegue obsoletos sin tocar el sitio actual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime,json,os,urllib.request,urllib.error
          base="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]
          headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["GH_TOKEN"],"User-Agent":"WhereToGo-ReleaseRecovery"}
          def request(method,url,payload=None):
              data=json.dumps(payload).encode() if payload is not None else None
              req=urllib.request.Request(url,method=method,headers=headers,data=data)
              with urllib.request.urlopen(req,timeout=25) as resp:return json.load(resp) if resp.status!=204 else {}
          try:
              deployments=request("GET",base+"/deployments?environment=github-pages&per_page=40")
              now=datetime.datetime.now(datetime.timezone.utc)
              for item in deployments:
                  created=datetime.datetime.fromisoformat(item["created_at"].replace("Z","+00:00"))
                  if (now-created).total_seconds()<7200:continue
                  statuses=request("GET",base+"/deployments/"+str(item["id"])+"/statuses?per_page=1")
                  current=statuses[0].get("state") if statuses else "unknown"
                  if current not in ("pending","in_progress","queued"):continue
                  request("POST",base+"/deployments/"+str(item["id"])+"/statuses",{
                      "state":"inactive","description":"Despliegue antiguo atascado; liberar solo después de dos horas"
                  })
                  print("Despliegue obsoleto inactivado:",item["id"],"sha",item["sha"][:8])
          except urllib.error.HTTPError as exc:
              print("Aviso: permisos insuficientes para limpiar despliegue:",exc.code)
              # Do not claim a fix or destroy anything: continue normal deploy.
          PY
      - name: Publicar aplicación
        id: publish
        uses: actions/deploy-pages@v4
        with:
          timeout: '600000'
      - name: "Verificar que se publicó y responde por HTTP"
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          if [ -z "$PAGE_URL" ]; then
            echo "::error::GitHub no devolvió URL de publicación."
            exit 1
          fi
          python - <<'PY'
          import os,time,urllib.request
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base,headers={'User-Agent':'WhereToGo-DeploymentCheck/1.0'}),timeout=20) as response:
                      body=response.read()
                      if response.status==200 and all(x in body for x in (b'navy-gold-mobile.css',b'data-view="tours"',b'tours.js',b'id="location-pill"',b'world-explorer.js',b'id="wtg-local-discovery"',b'local-discovery.css',b'native-mobile.css',b'id="wtg-onboarding"',b'wtg-area-discovery',b'ux-polish.css',b'A d\xc3\xb3nde ir')):
                          print('Aplicación publicada y verificada:',base)
                          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                              out.write('### Aplicación publicada y comprobada\n'+base+'\n')
                          break
                      raise RuntimeError('Respuesta inesperada: '+str(response.status))
              except Exception as exc:
                  print('Esperando propagación:',attempt+1,str(exc))
                  if attempt==11:raise
                  time.sleep(10)
          # Verificar el archivo REAL de la publicación, sin imprimir ni revelar la clave.
          import re
          with urllib.request.urlopen(base+'google-places-key.js',timeout=20) as res:
              js=res.read().decode('utf-8')
              assert res.status==200 and re.search(r"WTG_GOOGLE_MAPS_KEY\s*=\s*['\"]AIza[A-Za-z0-9_-]{20,100}['\"];",js),'Clave web no configurada en el despliegue'
              print('Google Places: clave del navegador configurada en sitio público (valor oculto)')
          with urllib.request.urlopen(base+'app.js',timeout=20) as res:
              js=res.read().decode('utf-8')
              assert 'enrichDominicanGooglePlaces' in js,'Falta conexión Google con catálogo dominicano'
              assert 'renderLocalDiscovery' in js,'No se publicó la portada de descubrimiento por destino'
              print('Google Places: integración RD publicada')
          for asset in ('world-location.js','world-explorer.js','world-explorer.css','city-covers.js','world-geography.js','native-mobile.css','local-discovery.css','onboarding.js','onboarding.css','ux-polish.css','municipality-geocoder.js','area-discovery.js','area-discovery.css'):
              with urllib.request.urlopen(base+asset,timeout=20) as response:
                  assert response.status==200 and len(response.read())>100,asset
                  print('ASSET MUNDIAL PUBLICADO:',asset)
          # Check the exact deployed commit, rather than trusting a prior version
          # from CDN or a successful push that never reached GitHub Pages.
          import json
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          for attempt in range(12):
              try:
                  req=urllib.request.Request(base+'data/release.json?commit='+os.environ['GITHUB_SHA'][:12],headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      release=json.load(response)
                  if release.get('commit')!=os.environ['GITHUB_SHA']:
                      raise RuntimeError('Pages todavía publica una revisión anterior')
                  print('VERSIÓN EXACTA CONFIRMADA EN PÁGINA PÚBLICA:',release['commit'])
                  break
              except Exception as exc:
                  if attempt==11:raise
                  print('Esperando nueva revisión publicada:',attempt+1,str(exc))
                  time.sleep(10)
          # Verify national data files are genuinely published at the URL, not
          # merely bundled in the artifact.
          for path in ('data/places/manifest.json','data/places/cell_548_546.json','data/pages-catalog-check.json'):
              req=urllib.request.Request(base+path,headers={'User-Agent':'WhereToGo-Catalog-Smoke/1.0'})
              with urllib.request.urlopen(req,timeout=25) as res:
                  raw=res.read()
                  assert res.status==200 and len(raw)>50,(path,res.status,len(raw))
                  data=json.loads(raw)
                  if path.endswith('manifest.json'):assert data['recordCount']>=44000,data
                  if path.endswith('cell_548_546.json'):assert isinstance(data,list) and len(data)>100,(path,len(data))
                  print('PUBLICADO Y COMPROBADO:',path,len(raw),'bytes')
          PY
