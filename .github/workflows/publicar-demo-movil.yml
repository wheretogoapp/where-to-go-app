name: Where to Go - Vista móvil alternativa sin Netlify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-demo-movil.yml'
      - 'Where_to_Go_Proyecto_Completo/tools/build_pages_preview.py'
      - 'Where_to_Go_Proyecto_Completo/public/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: wtg-pages-mobile-backup
  cancel-in-progress: true
jobs:
  demo_movil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Comprobar disponibilidad de GitHub Pages sin provocar error rojo
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS --max-time 20 -o /tmp/wtg-pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo 'GitHub Pages está activo. Publicando versión móvil alternativa.'
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PAGES AÚN NO ACTIVADO (respuesta $code)"
            echo "Una sola vez, desde el celular: https://github.com/$GITHUB_REPOSITORY/settings/pages"
            echo "Source: GitHub Actions; guardar. Ejecutar de nuevo este flujo."
          fi
      - name: Empaquetar web y atlas de 500 fotos para sitio de prueba
        if: steps.pages.outputs.enabled == 'true'
        run: |
          python Where_to_Go_Proyecto_Completo/tools/build_pages_preview.py \
            --source Where_to_Go_Proyecto_Completo/public \
            --output /tmp/where-to-go-pages --prefix /where-to-go-app
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: /tmp/where-to-go-pages
      - name: Publicar vista móvil independiente de Netlify
        id: publish
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
