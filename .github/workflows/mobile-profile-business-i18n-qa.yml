name: Where to Go - Perfil, Negocios, Contraste e Idiomas (preview)
on:
  push:
    branches:
      - fix/mobile-profile-promotions-i18n-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar JavaScript y enlaces CSS
        run: |
          node --check Where_to_Go_Proyecto_Completo/public/language.js
          node --check Where_to_Go_Proyecto_Completo/public/traveler-profile.js
          node --check Where_to_Go_Proyecto_Completo/public/app.js
          node --check Where_to_Go_Proyecto_Completo/public/legal-language.js
          python - <<'PY'
          from pathlib import Path
          p=Path('Where_to_Go_Proyecto_Completo/public')
          html=(p/'index.html').read_text()
          css=(p/'mobile-ui-repair.css').read_text()
          assert html.count('data-view="promocionar" aria-label="Promocionar mi negocio"')==1
          assert 'mobile-ui-repair.css?v=1' in html
          assert 'language.js?v=7.2' in html
          assert 'traveler-profile.js?v=2' in html
          assert css.count('{')==css.count('}'), 'CSS braces malformed'
          promo=html.split('id="view-promocionar"',1)[1].split('id="view-mis-negocios"',1)[0]
          for price in ('<strong>$10</strong>','<strong>$30</strong>','<strong>$50</strong>'):
              assert price in promo, 'Business promotion tier missing: '+price
          assert 'pago único' in promo and 'USD / mes' in promo
          import subprocess
          base='4e4459c1aa1811b2fc24df938479fc8710c7314d'
          for name in ('app.js','google-places-adapter.js','world-explorer.js','world-location.js',
                       'province-heroes.js','onboarding.js'):
              current=(p/name).read_bytes()
              original=subprocess.check_output(['git','show',base+':Where_to_Go_Proyecto_Completo/public/'+name])
              assert current==original,'Protected application/map logic changed: '+name
          for name in ('privacidad.html','terminos.html'):
              assert './legal-language.js?v=1' in (p/name).read_text()
          print('Protected Google/region logic untouched; business plans and translated legal pages present')
          PY
      - name: Probar traducciones con el conjunto existente
        run: |
          node --test Where_to_Go_Proyecto_Completo/tests/i18n-six-languages.test.cjs
      - name: Instalar Chromium de prueba
        run: |
          npm install --no-save playwright
          if command -v google-chrome >/dev/null 2>&1;then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Probar barra persistente, promociones, detalles e idiomas
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory Where_to_Go_Proyecto_Completo/public >/tmp/mobileqa-http.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,...(process.env.CHROME_BIN?{executablePath:process.env.CHROME_BIN}:{})});
          const locales=['en','fr','pt','de','it','es'];
          for(const [name,width,height] of [['iphone',390,844],['compact',360,740]]){
            const page=await browser.newPage({viewport:{width,height},isMobile:true,hasTouch:true,deviceScaleFactor:1,locale:'es-DO'});
            const failures=[],pageLoads=[];
            page.on('pageerror',e=>failures.push(e.message.slice(0,100)));
            page.on('domcontentloaded',()=>pageLoads.push('loaded'));
            await page.route(/https:\/\/maps\.googleapis\.com\/.*/,route=>route.abort());
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:40000});
            await page.waitForFunction(()=>!!window.WTG_PROFILE&&!!window.WTG_I18N&&typeof navigate==='function',{timeout:20000});
            await page.evaluate(()=>{
              const ob=document.getElementById('wtg-onboarding');
              ob.hidden=true;ob.style.setProperty('display','none','important');
              const gate=document.getElementById('auth-gate');
              gate.hidden=true;gate.style.setProperty('display','none','important');
              document.body.classList.remove('wtg-onboarding-active');
            });
            await page.locator('.mobile-tabbar [data-profile-open]').click();
            const profile=await page.evaluate(()=>{
              const root=document.getElementById('wtg-traveler-profile');
              const bar=document.querySelector('.mobile-tabbar');
              const r=root.getBoundingClientRect(),n=bar.getBoundingClientRect();
              const business=document.querySelector('.mobile-tabbar [data-view="promocionar"]');
              const hit=document.elementFromPoint(n.left+n.width/2,n.top+27);
              return {profileVisible:!root.hidden,profileBottom:r.bottom,barTop:n.top,
                count:bar.querySelectorAll('.mobile-tab').length,
                activeProfile:!!bar.querySelector('[data-profile-open].active'),
                navAboveProfile:Number(getComputedStyle(bar).zIndex)>Number(getComputedStyle(root).zIndex),
                hitTab:!!hit?.closest('.mobile-tabbar'),
                hasBusiness:!!business};
            });
            console.log('PROFILE_NAV',name,JSON.stringify(profile));
            if(!profile.profileVisible||!profile.activeProfile||profile.count!==7||!profile.hasBusiness||!profile.navAboveProfile||!profile.hitTab||profile.profileBottom>profile.barTop+3)
              throw Error('Profile blocked mobile navigation: '+JSON.stringify(profile));
            await page.screenshot({path:'/tmp/profile-'+name+'.png'});
            await page.locator('.mobile-tabbar [data-view="promocionar"]').click();
            const promo=await page.evaluate(()=>({
              hiddenProfile:document.getElementById('wtg-traveler-profile').hidden,
              activeBusiness:document.getElementById('view-promocionar').classList.contains('active'),
              prices:[...document.querySelectorAll('#view-promocionar .plan-price strong')].map(x=>x.textContent.trim()),
              barCount:document.querySelectorAll('.mobile-tabbar .mobile-tab').length
            }));
            console.log('BUSINESS_NAV',name,JSON.stringify(promo));
            if(!promo.hiddenProfile||!promo.activeBusiness||promo.prices.join(',')!=='$10,$30,$50'||promo.barCount!==7)
              throw Error('Promotion page not accessible from mobile: '+JSON.stringify(promo));
            await page.screenshot({path:'/tmp/business-'+name+'.png'});
            await page.locator('.mobile-tabbar [data-view="explorar"]').click();
            await page.evaluate(()=>{
              document.getElementById('explore-list').innerHTML='<article class="place-card"><div class="place-body"><div class="place-footer"><span class="distance-badge">↗ 3 km</span><button class="card-open">Ver detalles →</button></div></div></article>';
            });
            const color=await page.evaluate(()=>{
              const btn=document.querySelector('#view-explorar #explore-list .card-open');
              const s=getComputedStyle(btn);
              return {color:s.color,fill:s.webkitTextFillColor,opacity:s.opacity,fontSize:s.fontSize,
                bg:s.backgroundImage,minHeight:s.minHeight};
            });
            console.log('DETAIL_CONTRAST',name,JSON.stringify(color));
            if(!color.color.includes('16, 45, 70')||color.opacity!=='1'||!color.bg.includes('gradient'))
              throw Error('Detail action text still not readable: '+JSON.stringify(color));
            await page.screenshot({path:'/tmp/explore-'+name+'.png'});
            await page.locator('.mobile-tabbar [data-profile-open]').click();
            const original=await page.evaluate(()=>document.getElementById('wtg-profile-sync').textContent);
            if(!original.includes('dispositivo'))throw Error('Expected Spanish sync text: '+original);
            for(const lang of locales){
              await page.evaluate(lang=>window.WTG_I18N.change(lang,false),lang);
              await page.waitForTimeout(260);
              const snap=await page.evaluate(()=>({
                lang:document.documentElement.lang,
                business:document.querySelector('.mobile-tabbar [data-view="promocionar"] small').textContent,
                sync:document.getElementById('wtg-profile-sync').textContent,
                profileBrand:document.querySelector('.wtg-profile-brand').textContent.trim(),
                button:document.getElementById('wtg-profile-install').textContent
              }));
              console.log('SIX_LANGUAGE',name,lang,JSON.stringify(snap));
              if(snap.lang!==lang||lang!=='es'&&(snap.sync===original||snap.profileBrand.includes('MI ESPACIO')))
                throw Error('Untranslated profile in '+lang+': '+JSON.stringify(snap));
            }
            await page.locator('.mobile-tabbar [data-view="inicio"]').click();
            if(!(await page.evaluate(()=>document.getElementById('wtg-traveler-profile').hidden)))
              throw Error('Profile still blocks Inicio tab');
            if(pageLoads.length!==1)throw Error('Unwanted reload switching mobile tabs');
            console.log('UI_QA_PASS',name,'languages=6', 'business-prices=10/30/50', 'seven-tabs=ok');
            await page.close();
          }
          await browser.close();
          JS
      - name: Confirmar la versión pública en navegador móvil real emulado
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const site='https://wheretogoapp.github.io/where-to-go-app/';
          const sha='13dbfbc1a33bf74dc5370d6032b5d8260478590b';
          const browser=await chromium.launch({headless:true,...(process.env.CHROME_BIN?{executablePath:process.env.CHROME_BIN}:{})});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,locale:'es-DO'});
          await page.route('https://maps.googleapis.com/**',r=>r.abort());
          let loads=0;page.on('domcontentloaded',()=>loads++);
          const response=await page.goto(site,{waitUntil:'domcontentloaded',timeout:50000});
          if(response?.status()!==200)throw Error('Site unavailable: '+response?.status());
          await page.waitForFunction(()=>!!window.WTG_I18N&&!!window.WTG_PROFILE,{timeout:22000});
          const snap=await page.evaluate(async()=>{
            const r=await fetch('./data/release.json',{cache:'no-store'});
            const release=await r.json();
            const css=await fetch('./mobile-ui-repair.css?v=1',{cache:'no-store'});
            const styles=await css.text();
            return {sha:release.commit,cssStatus:css.status,cssBytes:styles.length,
              cssHasFix:styles.includes('Readable action labels'),
              hasBusiness:!!document.querySelector('.mobile-tabbar [data-view="promocionar"]'),
              tabs:document.querySelectorAll('.mobile-tabbar .mobile-tab').length,
              profileVersion:!!document.querySelector('script[src*="traveler-profile.js?v=2"]'),
              langVersion:!!document.querySelector('script[src*="language.js?v=7.2"]'),
              businessPrices:[...document.querySelectorAll('#view-promocionar .plan-price strong')].map(e=>e.textContent.trim())};
          });
          console.log('PUBLIC_LIVE_ASSETS:',JSON.stringify(snap));
          if(snap.sha!==sha||snap.cssStatus!==200||snap.cssBytes<4500||!snap.cssHasFix||
             !snap.hasBusiness||snap.tabs!==7||!snap.profileVersion||!snap.langVersion||
             snap.businessPrices.join(',')!=='$10,$30,$50')
            throw Error('Public assets not updated: '+JSON.stringify(snap));
          await page.evaluate(()=>{
            document.getElementById('wtg-onboarding').hidden=true;
            document.getElementById('wtg-onboarding').style.setProperty('display','none','important');
            document.getElementById('auth-gate').hidden=true;
            document.getElementById('auth-gate').style.setProperty('display','none','important');
            document.body.classList.remove('wtg-onboarding-active');
          });
          await page.locator('.mobile-tabbar [data-profile-open]').click();
          const first=await page.evaluate(()=>{
            const p=document.getElementById('wtg-traveler-profile').getBoundingClientRect();
            const n=document.querySelector('.mobile-tabbar').getBoundingClientRect();
            return {profileBottom:p.bottom,navTop:n.top,active:!!document.querySelector('.mobile-tabbar [data-profile-open].active')};
          });
          if(first.profileBottom>first.navTop+2||!first.active)throw Error('Public profile hides navigation: '+JSON.stringify(first));
          await page.locator('.mobile-tabbar [data-view="promocionar"]').click();
          if(!(await page.evaluate(()=>document.getElementById('wtg-traveler-profile').hidden&&document.getElementById('view-promocionar').classList.contains('active'))))
            throw Error('Public business tab blocked by profile');
          await page.locator('.mobile-tabbar [data-view="explorar"]').click();
          await page.evaluate(()=>{
            document.getElementById('explore-list').innerHTML='<article class="place-card"><div class="place-body"><div class="place-footer"><button class="card-open">Ver detalles →</button></div></div></article>';
          });
          const styles=await page.evaluate(()=>{
            const e=document.querySelector('#view-explorar .card-open'),cs=getComputedStyle(e);
            return {text:cs.color,fill:cs.webkitTextFillColor,background:cs.backgroundImage};
          });
          if(styles.text!=='rgb(16, 45, 70)'||!styles.background.includes('gradient'))
            throw Error('Public detail button still unreadable: '+JSON.stringify(styles));
          await page.evaluate(()=>window.WTG_I18N.change('en',false));
          await page.waitForTimeout(350);
          const translated=await page.locator('.mobile-tabbar [data-view="promocionar"] small').innerText();
          if(translated!=='Businesses')throw Error('Public business navigation untranslated: '+translated);
          if(loads!==1)throw Error('The page navigated/reloaded unexpectedly');
          console.log('PUBLIC_LIVE_MOBILE_PASS:',JSON.stringify({first,styles,translated,loads,sha:snap.sha}));
          await browser.close();
          JS
      - name: Comprobar documentos completos en seis idiomas
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory Where_to_Go_Proyecto_Completo/public >/tmp/legal-http.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,...(process.env.CHROME_BIN?{executablePath:process.env.CHROME_BIN}:{})});
          const labels={
            en:['Privacy policy','Terms and conditions'],
            fr:['Politique de confidentialité','Conditions générales'],
            pt:['Política de privacidade','Termos e condições'],
            de:['Datenschutzerklärung','Nutzungsbedingungen'],
            it:['Informativa sulla privacy','Termini e condizioni']
          };
          for(const [file,index,count] of [['privacidad.html',0,17],['terminos.html',1,14]]){
            const page=await browser.newPage({locale:'es-DO'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8766/'+file,{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForFunction(()=>!!window.WTG_LEGAL_I18N,{timeout:5000});
            for(const lang of ['en','fr','pt','de','it']){
              await page.locator('#wtg-legal-language').selectOption(lang);
              const info=await page.evaluate(()=>({
                lang:document.documentElement.lang,title:document.querySelector('header h1').textContent,
                sections:document.querySelectorAll('main h2,main p').length,
                first:document.querySelector('main h2').textContent,
                body:document.querySelector('main p').textContent.slice(0,85),
                links:[...document.querySelectorAll('main p a')].length,
                providerLink:[...document.querySelectorAll('main p a')].some(a=>a.href.includes('google.com')||a.href.includes('privacidad.html'))
              }));
              console.log('LEGAL_I18N_PASS_CANDIDATE',file,lang,JSON.stringify(info));
              if(info.lang!==lang||info.title!==labels[lang][index]||info.sections!==count||
                 info.first.startsWith('1. Qué')||info.first.startsWith('1. Alcance')||
                 !info.providerLink||errors.length)
                throw Error('Legal translation broken: '+JSON.stringify(info)+' JS='+JSON.stringify(errors));
            }
            await page.locator('#wtg-legal-language').selectOption('es');
            const restored=await page.evaluate(()=>({
              lang:document.documentElement.lang,first:document.querySelector('main h2').textContent,
              title:document.querySelector('header h1').textContent}));
            if(restored.lang!=='es'||!restored.first.startsWith('1.')||
               restored.title!==(index===0?'Política de privacidad':'Términos y condiciones'))
              throw Error('Spanish legal source was not restored: '+JSON.stringify(restored));
            console.log('LEGAL_SIX_LANGUAGES_PASS',file);
            await page.close();
          }
          await browser.close();
          JS
      - name: Guardar capturas de las pantallas verificadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: where-to-go-profile-business-contrast-preview
          path: |
            /tmp/profile-*.png
            /tmp/business-*.png
            /tmp/explore-*.png
          if-no-files-found: ignore
