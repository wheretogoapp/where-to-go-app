name: Where to Go - diagnostico puntual Google Places publico
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnostico-google-places-publico.yml'
permissions:
  contents: read
jobs:
  google-places-real:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar navegador de diagnóstico
        run: |
          npm install --no-save playwright
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Diagnosticar conexión Google Places en la web real sin revelar credenciales
        env:
          SITE: https://wheretogoapp.github.io/where-to-go-app/
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,...(process.env.CHROME_BIN?{executablePath:process.env.CHROME_BIN}:{})});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,locale:'es-DO'});
          const jsErrors=[],googleErrors=[],failedHosts=new Set();
          page.on('pageerror',e=>jsErrors.push(String(e?.name||'Error').slice(0,80)));
          page.on('console',msg=>{
            const raw=msg.text();
            const match=raw.match(/Google Maps JavaScript API error:\s*([A-Za-z_]+)/);
            if(match)googleErrors.push(match[1]);
          });
          page.on('requestfailed',r=>{
            try { const host=new URL(r.url()).hostname;
              if(/googleapis|gstatic/.test(host))failedHosts.add(host);
            }catch{}
          });
          try {
            const res=await page.goto(process.env.SITE,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>!!window.WTG_GOOGLE_PLACES,{timeout:20000});
            const googleResponses=[];
            page.on('response',res=>{
              try{const host=new URL(res.url()).hostname;if(/maps.googleapis.com|maps.gstatic.com/.test(host))googleResponses.push({host,status:res.status()})}catch{}
            });
            const info=await page.evaluate(async()=>{
              const api=window.WTG_GOOGLE_PLACES;
              const raw={configured:api.configured(),initialMapsReady:!!window.google?.maps?.importLibrary};
              const timeout=promise=>Promise.race([promise,new Promise(resolve=>setTimeout(()=>resolve({status:'timeout',places:[]}),40000))]);
              if(raw.configured){
                raw.scriptLoaded=await api.loadScript();
                raw.mapsReadyAfterScript=!!window.google?.maps?.importLibrary;
                await new Promise(resolve=>setTimeout(resolve,4000));
                raw.mapsReadyAfterFourSeconds=!!window.google?.maps?.importLibrary;
                raw.googleNamespace=!!window.google;
                raw.mapsNamespace=!!window.google?.maps;
                raw.scriptElements=[...document.querySelectorAll('script[src]')].filter(s=>s.src.includes('maps.googleapis.com/maps/api/js')).length;
                if(raw.mapsReadyAfterFourSeconds){
                  const puerto=await timeout(api.nearby({lat:19.7934,lon:-70.6884,radius:12000,category:'playas'}));
                  raw.puerto={status:puerto.status,count:(puerto.places||[]).length,photos:(puerto.places||[]).filter(p=>!!p.photo).length,failures:puerto.failures??null};
                  const santiago=await timeout(api.nearby({lat:19.4517,lon:-70.697,radius:12000,category:'restaurantes'}));
                  raw.santiago={status:santiago.status,count:(santiago.places||[]).length,photos:(santiago.places||[]).filter(p=>!!p.photo).length,failures:santiago.failures??null};
                }
              }
              try{const r=await fetch('/where-to-go-app/data/release.json',{cache:'no-store'});if(r.ok)raw.release=(await r.json()).commit;}catch{}
              return raw;
            });
            console.log('PUBLIC_HTTP:',res?.status());
            console.log('GOOGLE_DIAGNOSTIC:',JSON.stringify(info));
            console.log('GOOGLE_NETWORK_STATUS:',JSON.stringify(googleResponses));
            console.log('GOOGLE_JS_ERROR_CODES:',JSON.stringify(googleErrors));
            console.log('FAILED_GOOGLE_HOSTS:',JSON.stringify([...failedHosts]));
            console.log('APP_JS_ERROR_TYPES:',JSON.stringify(jsErrors.slice(0,8)));
            if(!info.scriptLoaded||info.puerto?.status!=='ok'||info.puerto.count<1||info.santiago?.status!=='ok'||info.santiago.count<1)
              throw Error('El adaptador no recuperó resultados reales de Google Places en dos provincias');
          }finally{await browser.close();}
          JS
