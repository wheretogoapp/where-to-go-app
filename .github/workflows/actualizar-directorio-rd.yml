name: Where to Go - Cargar directorio real de RD
on:
  workflow_dispatch:
    inputs:
      incluir_overture:
        description: "Incluir Overture Maps (descarga adicional opcional de mayor duración)"
        type: boolean
        default: false
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/actualizar-directorio-rd.yml'
      - 'Where_to_Go_Proyecto_Completo/tools/import_osm_rd.py'
      - 'Where_to_Go_Proyecto_Completo/tools/enrich_photos.py'
      - 'Where_to_Go_Proyecto_Completo/tools/enrich_geo_photos.py'
      - 'Where_to_Go_Proyecto_Completo/tools/preserve_photos.py'
      - 'Where_to_Go_Proyecto_Completo/tools/import_overture_rd.py'
permissions:
  contents: write
concurrency:
  group: wtg-import-rd
  cancel-in-progress: false
jobs:
  directorio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Instalar lector OSM
        run: python -m pip install 'osmium>=4,<6' 'shapely>=2,<3'
      - name: Descargar datos públicos y frontera de RD
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 420 --output /tmp/rd-haiti.osm.pbf 'https://download.geofabrik.de/central-america/haiti-and-domrep-latest.osm.pbf'
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 180 --output /tmp/countries.geojson 'https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson'
          test "$(stat -c%s /tmp/rd-haiti.osm.pbf)" -gt 10000000
      - name: Probar fuente antes de importar
        run: |
          python - <<'PYTEST'
          from pathlib import Path
          assert Path('/tmp/rd-haiti.osm.pbf').stat().st_size > 10000000
          assert Path('/tmp/countries.geojson').stat().st_size > 1000
          print('Fuentes descargadas. Construyendo índice dominicano...')
          PYTEST
      - name: Guardar fotografías verificadas de la publicación anterior
        run: |
          python Where_to_Go_Proyecto_Completo/tools/preserve_photos.py snapshot \
            --out Where_to_Go_Proyecto_Completo/public/data/places \
            --snapshot /tmp/wtg-verified-photos-before-import.json
      - name: Construir catalogo RD validado
        run: |
          python Where_to_Go_Proyecto_Completo/tools/import_osm_rd.py --pbf /tmp/rd-haiti.osm.pbf --countries /tmp/countries.geojson --out Where_to_Go_Proyecto_Completo/public/data/places
          python - <<'PY'
          import json
          p='Where_to_Go_Proyecto_Completo/public/data/places/manifest.json'
          x=json.load(open(p));assert x['recordCount']>=100, x
          print('RECUENTO NACIONAL PUBLICABLE:',x['recordCount'])
          print('POR CATEGORÍA:',x['categories'])
          PY
      - name: Instalar cliente Overture (opcional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.incluir_overture == true }}
        run: python -m pip install 'overturemaps>=0.13,<1'
      - name: Descargar puntos Overture de la zona RD (opcional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.incluir_overture == true }}
        run: |
          overturemaps download --type=place --bbox=-72.15,17.1,-68.0,20.25 -f geojsonseq -o /tmp/rd-overture.geojsonseq
          test -s /tmp/rd-overture.geojsonseq
      - name: Combinar Overture con OSM, filtrando frontera y duplicados (opcional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.incluir_overture == true }}
        run: |
          python Where_to_Go_Proyecto_Completo/tools/import_overture_rd.py \
            --input /tmp/rd-overture.geojsonseq \
            --countries /tmp/countries.geojson \
            --out Where_to_Go_Proyecto_Completo/public/data/places
      - name: Añadir fotos auténticas y licencias de Wikimedia (si están enlazadas al sitio)
        run: |
          python Where_to_Go_Proyecto_Completo/tools/enrich_photos.py --out Where_to_Go_Proyecto_Completo/public/data/places --max-wikidata 1600 --max-photos 1600
          python - <<'PY'
          import json
          d=json.load(open('Where_to_Go_Proyecto_Completo/public/data/places/manifest.json'))
          print('FOTOGRAFÍAS CON LICENCIA COMPROBADA:',d.get('licensedPhotoCount',0))
          PY
      - name: Descubrir imágenes adicionales solo con nombre y geolocalización Wikidata verificables
        run: |
          python -m py_compile Where_to_Go_Proyecto_Completo/tools/enrich_photos.py Where_to_Go_Proyecto_Completo/tools/enrich_geo_photos.py Where_to_Go_Proyecto_Completo/tools/preserve_photos.py
          python Where_to_Go_Proyecto_Completo/tools/enrich_geo_photos.py --out Where_to_Go_Proyecto_Completo/public/data/places --max-queries 480
      - name: Restaurar fotografías anteriores cuando el mismo lugar conserve su ID
        run: |
          python Where_to_Go_Proyecto_Completo/tools/preserve_photos.py restore \
            --out Where_to_Go_Proyecto_Completo/public/data/places \
            --snapshot /tmp/wtg-verified-photos-before-import.json
      - name: Comprobar categorías y archivos antes de publicar
        run: |
          python - <<'PY'
          import pathlib,json
          out=pathlib.Path('Where_to_Go_Proyecto_Completo/public/data/places')
          m=json.loads((out/'manifest.json').read_text())
          assert m['recordCount']>=100, m
          assert m['cells'], 'Sin celdas generadas'
          seen=0
          for cell in m['cells']:
            keys=m.get('splitCells',{}).get(cell) or [cell]
            assert keys, ('Zona vacía',cell)
            for key in keys:
              f=out/f'cell_{key}.json'
              assert f.exists(), f
              rows=json.loads(f.read_text(encoding='utf-8'))
              assert isinstance(rows,list), f
              seen+=len(rows)
          assert seen==m['recordCount'], (seen,m['recordCount'])
          print('OK:',seen,'lugares reales;',len(m['cells']),'zonas geográficas')
          print('FOTOGRAFÍAS REALES VERIFICADAS:',m.get('licensedPhotoCount',0))
          assert m.get('licensedPhotoCount',0)>=0
          PY
      - name: Publicar los datos en el mismo GitHub
        run: |
          set -euo pipefail
          git config user.name 'Where to Go Open Data'
          git config user.email 'actions@users.noreply.github.com'
          git add Where_to_Go_Proyecto_Completo/public/data/places/
          if ! git diff --cached --quiet; then
             git commit -m 'Directorio RD: lugares reales OSM clasificados'
             # Another edit may have reached main while this long import ran.
             # Rebase only our generated-data commit; never force-push over application changes.
             for attempt in 1 2 3 4; do
               git fetch origin main
               git rebase origin/main
               if git push origin HEAD:main; then
                 echo 'Catálogo actualizado sin sobrescribir otros cambios'
                 exit 0
               fi
               echo "Publicación concurrente, reintentando: $attempt"
               sleep 3
             done
             echo 'Error: no se pudo publicar sin conflicto; revisar rebase' >&2
             exit 1
          else
             echo 'Sin cambios en catálogo'
          fi
